name: Publish Lithium to GitHub Pages
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Regenerate every published analytical table and chart from shipped data
        run: make reproduce
        # checkout is clean; no cache, snapshot extraction, installation or secrets are needed here.
      - name: Reproduce research without credentials
        run: python tools/reproduce.py
      - name: Replay the attribution correction on identical evidence
        run: python tools/check_attribution_audit.py
      - name: Research regression checks
        run: python -m unittest discover -s tests
        env:
          PYTHONPATH: src
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/check-disclosure.cjs
      - run: node tools/check-durability.cjs
      - name: Install isolated browser-check tooling
        run: npm install --prefix "$RUNNER_TEMP/lithium-browser" playwright
      - name: Check Pages over HTTP and from disk
        run: node tools/check-dashboard.cjs
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/lithium-browser/node_modules/playwright
      - name: Assemble public files
        run: |
          mkdir -p _site
          cp -R docs/. _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: publish
        uses: actions/deploy-pages@v4
