[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solverline"
version = "0.1.0"
description = "Reproducible NEAR Intents attribution coverage research"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
solverline = ["assets/*.css", "assets/*.js", "assets/fonts/*"]
